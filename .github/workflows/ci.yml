name: Public portfolio checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      MPLBACKEND: Agg
      PYTHONUTF8: "1"
      TZ: UTC
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: technical/requirements.txt
      - run: python -m pip install -r technical/requirements.txt
      - name: Check public data, menu and excluded technical materials
        run: python -m pytest -q technical/tests
      - name: Rebuild PDF/PNG and execute the public notebook offline
        run: python technical/scripts/portfolio.py --check
      - name: Require committed results
        run: |
          git diff --exit-code
          test -z "$(git ls-files --others --exclude-standard)"
